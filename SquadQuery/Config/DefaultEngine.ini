; P07 SquadQuery - engine configuration.
; Keys marked "restated" repeat an engine default on purpose, so a later change can't silently alter a benchmark condition.

[/Script/EngineSettings.GameMapsSettings]
; An engine map with a floor and lights; no map has to be authored. The arena (cover, nav bounds, agents) is built by code.
GameDefaultMap=/Engine/Maps/Templates/Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default
; Our game mode: the default one without a player pawn (SQGameMode.h). The template map sets no game mode of its own.
GlobalDefaultGameMode=/Script/SquadQuery.SQGameMode

[/Script/Engine.Engine]
; Restated: no frame-rate smoothing or fixed frame-rate cap, so frame time reflects real work.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
; VSync off so Present never blocks the frame.
r.VSync=0

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/NavigationSystem.NavigationSystemV1]
; Restated (BaseEngine.ini): spawn a RecastNavMesh automatically once navigation bounds exist.
bAutoCreateNavigationData=True
; No Detour crowd manager (the default class is set in NavigationSystem.cpp:931; an empty one creates none, :1570-1579).
; Agents use the AI controller's path following, not crowd following. With the default, the crowd manager looks for a
; navmesh again while the world tears down, finds none, and logs a warning on every exit (CrowdManager.cpp:905; 09 S1).
CrowdManagerClass=

[/Script/NavigationSystem.RecastNavMesh]
; Not a default (BaseEngine.ini sets Static for NavigationData). The arena geometry and the nav bounds are spawned at
; runtime, so the navmesh must be generated at runtime too (01b_Research_Findings.md, finding 9).
RuntimeGeneration=Dynamic
