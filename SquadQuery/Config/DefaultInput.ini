[/Script/Engine.InputSettings]
; The engine's own defaults are the legacy UPlayerInput and UInputComponent (InputSettings.cpp:52-53). The Enhanced Input
; plugin is enabled by default, casts the player's input object to UEnhancedPlayerInput, and logs a warning on every map
; load when that cast fails (EnhancedInputSubsystems.cpp:79, 118). These are the values Epic's 5.8 templates ship with.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
